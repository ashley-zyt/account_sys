# 钉钉机器人统一配置（修改后重启服务即可生效）
#
# 每个机器人拥有独立的 webhook 地址，通过 robot 名称区分。
# keyword 为钉钉机器人「自定义关键词」安全设置，发送时若消息内容不含该关键词会自动补齐。
#
# 使用方式：
#   Dingtalk.send_text(:yanghao, "检测到浏览器被占用")
#   Dingtalk.send_markdown(:publish_result, "发布结果", "正文内容")

robots:
  agic_zyt:            # zyt接收
    name: zyt接收
    webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=962fd57e9de395d96eb717262bd55e9f1b73906d8d76f0b87a2c8d219f4ad902"
    keyword: 养号
  agic_dw:     # 杜维接收
    name: 杜维接收
    webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=33d818901dbc78e73d5a82bc0d1d6ff64d8ef5c76fe9a5731df59c4b7424f1f4"
    keyword: 发布结果
